            <h3>Contact Details</h3>
            <p><strong>Address:</strong> Main Tariq Road, Block 2, Karachi, Pakistan</p>
            <p style="margin-top: 10px;"><strong>Phone:</strong> +92 300 1234567</p>

        <div class="contact-form">
            <h3>Send Us a Message</h3>
            <form action="#">

                <input type="email" placeholder="Your Email" required>
